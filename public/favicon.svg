  <!-- "TUTOR" Bold White Typography -->
  <text
    x="256"
    y="328"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="'Montserrat', 'Segoe UI', 'Arial Black', Arial, sans-serif"
    font-size="92"
    font-weight="900"
    letter-spacing="4"
