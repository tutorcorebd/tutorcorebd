  <!-- "O" as White Ring with Two Sprout Leaves -->
  <circle
    cx="235"
    cy="380"
    r="20"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="13"
  />
  <!-- Sprout Stem & Leaves on "O" -->
  <path
    d="M 235 360 C 235 352 228 340 211 339 C 212 353 223 361 235 360 Z"
    fill="#86C240"
  />
  <path
    d="M 235 360 C 235 350 244 337 262 337 C 260 352 248 361 235 360 Z"
    fill="#86C240"
  />

  <!-- "RE" in Lime Green -->
  <text
    x="316"
    y="404"
    text-anchor="middle"
    fill="#86C240"
    font-family="'Montserrat', 'Segoe UI', Arial, sans-serif"
    font-size="68"
    font-weight="800"
    letter-spacing="3"
