    <path
      d="M 136 226 C 182 224 224 228 256 238 C 288 228 330 224 376 226 L 376 238 L 136 238 Z"
      fill="#14532D"
    />

    <!-- Tree Trunk & Symmetrical Branches Growing from Book Spine -->
    <path
      d="M 250 238
         C 250 205 247 178 236 160
         C 224 142 204 128 186 118
         C 202 122 222 132 238 148
         C 234 134 222 116 206 102
         C 224 110 240 126 248 144
         C 249 128 247 110 242 94
         C 250 108 255 124 256 142
         C 257 124 262 108 270 94
         C 265 110 263 128 264 144
         C 272 126 288 110 306 102
         C 290 116 278 134 274 148
         C 290 132 310 122 326 118
         C 308 128 288 142 276 160
         C 265 178 262 205 262 238 Z"
      fill="#14532D"
    />

    <!-- Lower Left & Right Leaf Branches -->
    <path
      d="M 244 196 C 224 186 196 178 176 176 C 198 186 222 198 242 212 Z"
      fill="#14532D"
    />
    <path
      d="M 268 196 C 288 186 316 178 336 176 C 314 186 290 198 270 212 Z"
      fill="#14532D"
    />
    <path
      d="M 240 174 C 218 160 192 150 172 146 C 196 156 220 170 238 186 Z"
      fill="#14532D"
    />
    <path
      d="M 272 174 C 294 160 320 150 340 146 C 316 156 292 170 274 186 Z"
      fill="#14532D"
    />
