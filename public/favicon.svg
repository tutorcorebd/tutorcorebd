    />
    <path
      d="M 410 238 L 410 104 L 370 74 L 370 238 Z"
      fill="#14532D"
    />
    <!-- Lime cutout inside outer book covers to create crisp page lines -->
    <path
      d="M 114 238 L 114 111 L 142 89 L 142 238 Z"
      fill="#86C240"
    />
    <path
      d="M 398 238 L 398 111 L 370 89 L 370 238 Z"
      fill="#86C240"
    />

    <!-- Main Open Book Left & Right Pages -->
    <path
      d="M 136 238 L 136 66 C 175 64 220 74 256 102 C 292 74 337 64 376 66 L 376 238 L 362 238 L 362 82 C 328 82 288 92 256 118 C 224 92 184 82 150 82 L 150 238 Z"
