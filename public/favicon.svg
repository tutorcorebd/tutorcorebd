<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Tutor Core Official Logo">
  <defs>
    <clipPath id="innerCircleClip">
      <circle cx="256" cy="242" r="206" />
    </clipPath>
  </defs>

  <!-- Outer Light-Lime Bottom Arc -->
  <path
    d="M 28 318 A 240 240 0 0 0 484 318"
    fill="none"
    stroke="#C7F284"
    stroke-width="11"
    stroke-linecap="butt"
  />

  <!-- Main Deep Forest Green Circle -->
  <circle cx="256" cy="242" r="222" fill="#14532D" />

  <!-- Upper Dome & Curved Side Arcs (clipped inside dark green border) -->
  <g clip-path="url(#innerCircleClip)">
    <!-- Outer curved lime ring in upper half -->
    <path
      d="M 50 238 A 206 206 0 0 1 462 238 L 434 238 A 178 178 0 0 0 78 238 Z"
      fill="#86C240"
    />

    <!-- Inner lime dome behind the open book -->
    <path
      d="M 96 238 A 160 160 0 0 1 416 238 Z"
