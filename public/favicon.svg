  <!-- "C" in Lime Green -->
  <text
    x="176"
    y="404"
    text-anchor="middle"
    fill="#86C240"
    font-family="'Montserrat', 'Segoe UI', Arial, sans-serif"
    font-size="68"
    font-weight="800"
